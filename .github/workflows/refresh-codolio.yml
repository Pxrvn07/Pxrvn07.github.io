name: Refresh Codolio card

on:
  schedule:
    # Every 6 hours. GitHub may delay scheduled runs under load.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-codolio
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest Codolio stats
        run: python3 scripts/fetch_codolio.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/codolio.json; then
            echo "No change in Codolio stats."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/codolio.json
          git commit -m "chore: refresh Codolio stats"
          git push
